name: Restore original Baseball Jersey in review branch
on:
  push:
    branches: [baseball-restoration-review-20261101]
    paths: ['.github/workflows/restore-baseball-review.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exactly the original source
        run: |
          git show origin/backup/pre-layered-baseball-2026-11-01:guides/baseball_jersey.svg > guides/baseball_jersey.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('guides/baseball_jersey.svg')
          r=ET.fromstring(p.read_text())
          assert r.tag.endswith('svg') and len(p.read_bytes())>100000
          print("Original verified",len(p.read_bytes()))
          PY
      - name: Commit only on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/baseball_jersey.svg
          git diff --cached --quiet || (git commit -m "Recover original Baseball Jersey artwork on review branch" && git push)
