name: Fix guide image rotation
on:
  push:
    paths:
      - '.github/workflows/fix-guide-image-rotation.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix assignments based on verified on-screen mismatches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          fixes={
            'sweater':('03DEC799-922B-4278-A912-94AB4B92A3B8.png','D20EE804-FC3F-4A5A-B8F8-DDBA1030065C.png'),
            'cardigan':('2F9C3857-20DA-4A80-A454-D4509D853ECC.png','D85A1D86-87A3-4C88-8FC5-115C053CA5F5.png'),
            'hooded_jacket':('D20EE804-FC3F-4A5A-B8F8-DDBA1030065C.png','2F9C3857-20DA-4A80-A454-D4509D853ECC.png'),
            'bomber_jacket':('D85A1D86-87A3-4C88-8FC5-115C053CA5F5.png','03DEC799-922B-4278-A912-94AB4B92A3B8.png')
          }
          for key,(old,new) in fixes.items():
            if not Path(new).is_file(): raise SystemExit('Missing '+new)
            pattern=r'("'+re.escape(key)+r'"\s*:\s*\{[^{}]*?"embedded"\s*:\s*"\./)'+re.escape(old)+r'(")'
            s,n=re.subn(pattern,lambda m:m.group(1)+new+m.group(2),s,count=1)
            if n!=1: raise SystemExit('Safe stop: unexpected definition '+key)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match four guide pictures to actual garment categories"
          git push
