name: Produce Baseball Jersey artwork review
on:
  push:
    branches: [baseball-restoration-review-20261101]
    paths: ['.github/workflows/baseball-artwork-review.yml', '.github/scripts/baseball_artwork_review.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy opencv-python-headless
      - name: Build corrected original
        run: python3 .github/scripts/baseball_artwork_review.py
      - name: Commit reviewed candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/baseball_jersey.svg guides/baseball-review.png
          git diff --cached --quiet || (git commit -m "Prepare original-artwork Baseball Jersey correction candidate" && git push)
