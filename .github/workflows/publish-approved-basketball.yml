name: Publish inspected Basketball Jersey guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-approved-basketball.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy verified single guide from review
        run: |
          git fetch origin basketball-jersey-review-20261101
          git show origin/basketball-jersey-review-20261101:guides/basketball_jersey.svg > guides/basketball_jersey.svg
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,io,xml.etree.ElementTree as ET
          from PIL import Image
          s=Path('guides/basketball_jersey.svg').read_text()
          ET.fromstring(s)
          match=re.search(r'data:image/png;base64,([^"]+)',s)
          assert match
          im=Image.open(io.BytesIO(base64.b64decode(match.group(1))))
          assert im.size == (1254,1254), im.size
          assert len(s)>100000
          print('Verified basketball artwork',im.size,len(s))
          PY
      - name: Publish only Basketball Jersey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/basketball_jersey.svg
          git diff --cached --quiet || (git commit -m "Publish approved Basketball Jersey artwork" && git push)
