name: Rebuild clean Basketball guide from original and approved master
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rebuild-clean-basketball.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install pillow numpy opencv-python-headless
      - name: Recreate from untouched original before integrating official logo
        run: |
          git show origin/backup/pre-layered-baseball-2026-11-01:guides/basketball_jersey.svg > guides/basketball_jersey.svg
          git show origin/basketball-jersey-review-20261101:.github/scripts/build_basketball_approved.py > /tmp/build_basketball_approved.py
          python3 /tmp/build_basketball_approved.py
          python3 - <<'PY'
          import re,base64,io
          from pathlib import Path
          from PIL import Image
          import numpy as np
          def unpack(path):
              s=Path(path).read_text()
              m=re.search(r'data:image/(?:png|jpeg);base64,([^"]+)',s)
              assert m
              return Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
          source=np.asarray(unpack('guides/baseball_jersey.svg')).astype(np.float32)
          target=np.asarray(unpack('guides/basketball_jersey.svg')).astype(np.float32)
          assert source.shape==target.shape, (source.shape,target.shape)
          yy,xx=np.mgrid[:target.shape[0],:target.shape[1]]
          # The entire official logo is copied pixel-for-pixel. Only the empty
          # margin beyond the logo is joined to the original unpatched canvas.
          wx=np.clip((280-xx)/10,0,1)
          wy=np.clip((334-yy)/45,0,1)
          alpha=(wx*wy)[...,None]
          out=np.uint8(np.clip(source*alpha+target*(1-alpha),0,255))
          assert np.array_equal(out[:285,:270],source[:285,:270].astype('uint8'))
          # Validate that basketball heading, garment, instruction panels untouched.
          assert np.array_equal(out[0:200,285:],target[0:200,285:].astype('uint8'))
          assert np.array_equal(out[360:,:,:],target[360:,:,:].astype('uint8'))
          im=Image.fromarray(out)
          b=io.BytesIO();im.save(b,'PNG',optimize=True)
          svg='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1248 1248" width="1248" height="1248"><image width="1248" height="1248" xlink:href="data:image/png;base64,'+base64.b64encode(b.getvalue()).decode()+'"/></svg>'
          Path('guides/basketball_jersey.svg').write_text(svg)
          im.thumbnail((650,650));im.save('basketball-clean-master-QA.jpg',quality=86)
          print('Checked logo sharp, no duplicate art; template remains one single master image')
          PY
      - name: Commit verified guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/basketball_jersey.svg basketball-clean-master-QA.jpg
          git commit -m "Rebuild Basketball guide cleanly from original approved master" && git push
