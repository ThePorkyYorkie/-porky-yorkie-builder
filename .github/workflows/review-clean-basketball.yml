name: Review clean Basketball composite
on:
  push:
    branches: [repair/basketball-remove-ghost-art-20261101]
    paths: ['.github/workflows/review-clean-basketball.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install pillow numpy
      - name: Recompose independent intact header and jersey panels
        run: |
          python3 - <<'PY'
          import subprocess,re,base64,io
          from pathlib import Path
          from PIL import Image
          import numpy as np
          def extract(source):
            m=re.search(r'data:image/(?:png|jpeg);base64,([^"]+)',source)
            assert m
            return Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
          current=extract(Path('guides/basketball_jersey.svg').read_text())
          clean=extract(subprocess.check_output(['git','show','origin/basketball-jersey-review-20261101:guides/basketball_jersey.svg']).decode())
          assert current.size==clean.size==(1254,1254)
          output=np.array(clean)
          approved=np.asarray(current)
          # Header is kept exact from current; ALL garment and footer from the
          # clean, independently composed approved basketball master.
          # The 322-row boundary is empty page background above original neckline.
          output[:322,:,:]=approved[:322,:,:]
          assert np.array_equal(output[:322],approved[:322])
          assert np.array_equal(output[322:],np.asarray(clean)[322:])
          image=Image.fromarray(output)
          buf=io.BytesIO();image.save(buf,format='PNG',optimize=True)
          Path('guides/basketball_jersey.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1248" height="1248" viewBox="0 0 1248 1248"><image width="1248" height="1248" xlink:href="data:image/png;base64,'+base64.b64encode(buf.getvalue()).decode()+'"/></svg>')
          thumb=image.copy();thumb.thumbnail((700,700))
          b=io.BytesIO();thumb.save(b,format='JPEG',quality=80)
          Path('basketball-clean-visual.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700"><image width="700" height="700" href="data:image/jpeg;base64,'+base64.b64encode(b.getvalue()).decode()+'"/></svg>')
          print('Verified: no geometry below row 322 inherited from contaminated composite')
          PY
      - name: Save isolated reviewed candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/basketball_jersey.svg basketball-clean-visual.svg
          git commit -m "Remove ghost baseball collar and footer collision from Basketball master" && git push
