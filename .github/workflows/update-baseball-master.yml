name: Scoped Baseball Jersey Master Update
on:
  push:
    paths:
      - '.github/workflows/update-baseball-master.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - name: Update only Baseball Jersey artwork
        run: python3 .github/scripts/update_baseball_master.py
      - name: Commit scoped template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/baseball_jersey.svg
          git commit -m "Clean Baseball Jersey guide and apply official brand mark"
          git push
