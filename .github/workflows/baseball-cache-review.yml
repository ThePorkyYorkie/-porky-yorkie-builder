name: Cache-bust reviewed Baseball Jersey asset only
on:
  push:
    branches: [baseball-restoration-review-20261101]
    paths: ['.github/workflows/baseball-cache-review.yml']
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='"embedded": "guides/baseball_jersey.svg"'
          new='"embedded": "guides/baseball_jersey.svg?v=approved-original-20261101"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          print('Cache-busted only baseball source:',new)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Refresh only Baseball Jersey asset URL" && git pull --rebase && git push)
