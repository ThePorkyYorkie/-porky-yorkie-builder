name: Lock common form footer and logo to approved master
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lock-common-regions.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy
      - name: Copy common pixel-identical sections only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,io,re,numpy as np
          def load(file):
            m=re.search(r'data:image/(?:png|jpeg);base64,([^"]+)',Path(file).read_text())
            assert m
            return Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
          x=load('guides/baseball_jersey.svg')
          y=load('guides/basketball_jersey.svg')
          assert x.size==y.size
          a=np.asarray(x);b=np.array(y)
          # Form and footer are invariant to garment type.
          # Copy complete original components, never apply opacity or feathering.
          b[218:350,275:1248]=a[218:350,275:1248]
          b[1145:1254,:,:]=a[1145:1254,:,:]
          assert np.array_equal(b[218:350,275:1248],a[218:350,275:1248])
          assert np.array_equal(b[1145:,:,:],a[1145:,:,:])
          out=Image.fromarray(b)
          buf=io.BytesIO();out.save(buf,'PNG',optimize=True)
          Path('guides/basketball_jersey.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1248 1248" width="1248" height="1248"><image width="1248" height="1248" xlink:href="data:image/png;base64,'+base64.b64encode(buf.getvalue()).decode()+'"/></svg>')
          print('Exact common form and footer verified')
          PY
      - name: Commit only template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/basketball_jersey.svg
          git commit -m "Align Basketball form and footer to shared approved master" && git push
