name: Set reviewed Baseball Jersey value positions
on:
  push:
    branches: [baseball-restoration-review-20261101]
    paths: ['.github/workflows/baseball-position-review.yml', '.github/scripts/baseball_position_review.py']
permissions:
  contents: write
jobs:
  positions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/baseball_position_review.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Align Baseball Jersey measurement values with approved guide" && git pull --rebase && git push)
