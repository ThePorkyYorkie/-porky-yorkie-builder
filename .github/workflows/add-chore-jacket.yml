name: Add Chore Jacket safely
on:
  push:
    paths:
      - '.github/workflows/add-chore-jacket.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add only Chore Jacket to V3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if not Path("Chore_Jacket.png.png").is_file():
              raise SystemExit("SAFE STOP: uploaded Chore Jacket image missing")
          if "chore_jacket" in s:
              print("Chore Jacket already present; no change")
              raise SystemExit(0)
          marker=re.search(r'\bconst\s+TEMPLATES\s*=\s*\{',s)
          if not marker or "Measurement Builder v3" not in s[:1000]:
              raise SystemExit("SAFE STOP: V3 template marker not found")
          entry=json.dumps("chore_jacket")+":"+json.dumps({
              "label":"Chore Jacket",
              "fields":["Item Name","Tagged Size","Pit to Pit","Shoulder","Sleeve Length","Length"],
              "embedded":"./Chore_Jacket.png.png"
          })+","
          updated=s[:marker.end()]+entry+s[marker.end():]
          assert len(updated)-len(s)==len(entry)
          p.write_text(updated,encoding="utf-8")
          print("Added Chore Jacket; all original content preserved")
          PY
      - name: Commit one-file change
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Add Chore Jacket to V3 dropdown"
            git push
          fi
