<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Porky Yorkie Builder</title>
<style>
body{margin:0;background:#f7f1e7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}header{background:#061b3a;color:white;padding:14px 16px;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:18px}.sub{font-size:12px;opacity:.8}main{max-width:1220px;margin:auto;padding:12px}.card{background:white;border:1px solid #d7d0c7;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,.06)}.layout{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:920px){.layout{grid-template-columns:390px 1fr}}label{display:block;margin:10px 0 4px;font-size:13px;font-weight:900}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #b9b2aa;font-size:16px;background:white}button{border:0;background:#061b3a;color:white;font-weight:900;margin-top:10px}.green{background:#0a7f38}.red{background:#a71d2a}.secondary{background:#555}.small{font-size:13px;color:#555;line-height:1.35}.loaded{color:#0a7f38;font-weight:900}.missing{color:#a71d2a;font-weight:900}.hidden{display:none!important}.preview{position:relative;width:100%;background:#eee;border:1px solid #ccc;border-radius:12px;overflow:hidden;min-height:280px}#templateImg{width:100%;display:block}.overlay{position:absolute;transform:translate(-50%,-50%);color:#061b3a;font-weight:900;font-family:Arial,sans-serif;text-align:center;white-space:nowrap;padding:2px 4px;user-select:none;touch-action:none}.calibrating .overlay{outline:2px dashed #1473ff;background:rgba(255,255,255,.50);pointer-events:auto;cursor:move}details{margin-top:14px;border-top:1px solid #eee;padding-top:12px}summary{font-weight:900;cursor:pointer}
</style></head><body>
<header><div class="brand">Porky Yorkie Measurement Builder</div><div class="sub">Single-file GitHub Pages version</div></header><main>
<section class="card"><label>Garment Template</label><select id="templateSelect"></select><div id="status" class="small"></div></section>
<section class="layout"><aside class="card"><div id="fields"></div><button class="green" id="exportBtn">Export Finished PNG</button><button class="secondary" id="clearBtn">Clear Fields</button><details><summary>Position Adjust Mode</summary><p class="small">Use only if needed. Turn on, drag text, save positions.</p><button class="secondary" id="calibrateBtn">Turn On Position Adjust Mode</button><button class="green hidden" id="saveBtn">Save Text Positions</button><button class="red" id="resetBtn">Reset Positions</button></details></aside>
<section class="card"><div id="preview" class="preview"><img id="templateImg"><div id="overlay"></div></div><p class="small">Template images go in <b>templates/</b> using exact filenames like <b>long-sleeve-tshirt.png</b>.</p></section></section></main>
<script>
const TEMPLATES = [["short-sleeve-tshirt", "Short Sleeve T-Shirt", "short-sleeve-tshirt.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length"]], ["long-sleeve-tshirt", "Long Sleeve T-Shirt", "long-sleeve-tshirt.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]], ["hoodie", "Hoodie", "hoodie.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]], ["jeans", "Jeans", "jeans.png", ["Item Name", "Tagged Size", "Waist", "Rise", "Thigh", "Inseam", "Outseam", "Leg Opening"]], ["shorts", "Shorts", "shorts.png", ["Item Name", "Tagged Size", "Waist", "Rise", "Inseam", "Length", "Leg Opening"]], ["blazer-sportcoat", "Blazer / Sport Coat", "blazer-sportcoat.png", ["Item Name", "Tagged Size", "Pit to Pit", "Waist", "Shoulder", "Sleeve Length", "Length"]], ["workwear-jacket", "Workwear Jacket", "workwear-jacket.png", ["Item Name", "Tagged Size", "Pit to Pit", "Shoulder", "Sleeve Length", "Length"]], ["tank-top", "Tank Top", "tank-top.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length"]], ["sleeveless-shirt", "Sleeveless Shirt", "sleeveless-shirt.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length"]], ["basketball-jersey", "Basketball Jersey", "basketball-jersey.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length"]], ["baseball-jersey", "Baseball Jersey", "baseball-jersey.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length"]], ["football-jersey", "Football Jersey", "football-jersey.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]], ["short-sleeve-button-up", "Short Sleeve Button-Up", "short-sleeve-button-up.png", ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]], ["bib-overalls", "Bib Overalls", "bib-overalls.png", ["Item Name", "Tagged Size", "Overall Length", "Waist", "Rise", "Thigh", "Inseam", "Leg Opening"]], ["denim-jacket", "Denim Jacket", "denim-jacket.png", ["Item Name", "Tagged Size", "Pit to Pit", "Shoulder", "Sleeve Length", "Length"]], ["workwear-vest", "Workwear Vest", "workwear-vest.png", ["Item Name", "Tagged Size", "Pit to Pit", "Shoulder", "Length"]], ["sweater-vest", "Sweater Vest", "sweater-vest.png", ["Item Name", "Tagged Size", "Pit to Pit", "Shoulder", "Length"]]];
const DEFAULT_POSITIONS = {"Item Name": {"x": 50, "y": 20, "size": 24}, "Tagged Size": {"x": 50, "y": 26, "size": 24}, "Pit to Pit": {"x": 42, "y": 43, "size": 34}, "Length": {"x": 58, "y": 52, "size": 34}, "Sleeve Length": {"x": 75, "y": 43, "size": 32}, "Waist": {"x": 50, "y": 49, "size": 30}, "Rise": {"x": 52, "y": 45, "size": 30}, "Inseam": {"x": 46, "y": 58, "size": 30}, "Outseam": {"x": 70, "y": 56, "size": 30}, "Leg Opening": {"x": 52, "y": 70, "size": 30}, "Thigh": {"x": 45, "y": 52, "size": 30}, "Overall Length": {"x": 66, "y": 45, "size": 30}, "Shoulder": {"x": 48, "y": 35, "size": 30}};
let current = TEMPLATES[0], values = {}, positions = {}, calibrating=false;
const $ = id => document.getElementById(id);
function posFor(f){return DEFAULT_POSITIONS[f] ? {...DEFAULT_POSITIONS[f]} : {x:50,y:50,size:28}}
function loadPositions(){try{let p=JSON.parse(localStorage.getItem("py_pos_"+current[0])||"{}"); current[3].forEach(f=>{if(!p[f])p[f]=posFor(f)}); return p}catch(e){let p={}; current[3].forEach(f=>p[f]=posFor(f)); return p}}
function savePositions(){localStorage.setItem("py_pos_"+current[0],JSON.stringify(positions));alert("Positions saved for "+current[1])}
function init(){TEMPLATES.forEach((t,i)=>{let o=document.createElement("option");o.value=i;o.textContent=t[1];$("templateSelect").appendChild(o)}); $("templateSelect").onchange=()=>loadTemplate(Number($("templateSelect").value)); loadTemplate(0)}
function loadTemplate(i){current=TEMPLATES[i]; values={}; positions=loadPositions(); $("templateImg").src="templates/"+current[2]; $("templateImg").onload=()=>{$("status").innerHTML='<span class="loaded">✅ Loaded: '+current[1]+'</span>'; renderOverlay()}; $("templateImg").onerror=()=>{$("status").innerHTML='<span class="missing">❌ Missing image: templates/'+current[2]+'</span>'}; renderFields(); renderOverlay()}
function renderFields(){let box=$("fields"); box.innerHTML=""; current[3].forEach(f=>{let l=document.createElement("label");l.textContent=f;let inp=document.createElement("input");inp.placeholder=f;inp.oninput=()=>{values[f]=inp.value;renderOverlay()};box.appendChild(l);box.appendChild(inp)})}
function isMeasure(f){return f!=="Item Name"&&f!=="Tagged Size"}
function fmt(f,v){v=String(v||"").trim(); if(!v)return""; if(isMeasure(f)&&!v.endsWith('"'))return v+'"'; return v}
function renderOverlay(){let layer=$("overlay"), wrap=$("preview"); layer.innerHTML=""; wrap.classList.toggle("calibrating",calibrating); current[3].forEach(f=>{let p=positions[f]||posFor(f), v=fmt(f,values[f]); if(!v&&!calibrating)return; let d=document.createElement("div"); d.className="overlay"; d.textContent=v||f; d.style.left=p.x+"%"; d.style.top=p.y+"%"; d.style.fontSize=Math.max(11,wrap.clientWidth*((p.size||28)/1254))+"px"; d.style.opacity=v?1:.58; if(calibrating)drag(d,f); layer.appendChild(d)})}
function drag(el,f){let down=false;function move(x,y){let r=$("preview").getBoundingClientRect();positions[f].x=Math.max(0,Math.min(100,(x-r.left)/r.width*100));positions[f].y=Math.max(0,Math.min(100,(y-r.top)/r.height*100));el.style.left=positions[f].x+"%";el.style.top=positions[f].y+"%"} el.onpointerdown=e=>{down=true;el.setPointerCapture(e.pointerId);move(e.clientX,e.clientY)};el.onpointermove=e=>{if(down)move(e.clientX,e.clientY)};el.onpointerup=()=>down=false}
$("calibrateBtn").onclick=()=>{calibrating=!calibrating;$("calibrateBtn").textContent=calibrating?"Turn Off Position Adjust Mode":"Turn On Position Adjust Mode";$("saveBtn").classList.toggle("hidden",!calibrating);renderOverlay()};
$("saveBtn").onclick=savePositions;
$("resetBtn").onclick=()=>{if(confirm("Reset positions for this template?")){localStorage.removeItem("py_pos_"+current[0]);positions=loadPositions();renderOverlay()}};
$("clearBtn").onclick=()=>loadTemplate(Number($("templateSelect").value));
$("exportBtn").onclick=()=>{let img=$("templateImg"); if(!img.complete||img.naturalWidth===0){alert("Template image is missing or still loading.");return} let c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight; let ctx=c.getContext("2d"); ctx.drawImage(img,0,0); current[3].forEach(f=>{let v=fmt(f,values[f]); if(!v)return; let p=positions[f]||posFor(f), size=Math.round((p.size||28)*(c.width/1254)); ctx.fillStyle="#061b3a"; ctx.font="900 "+size+"px Arial, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(v,p.x/100*c.width,p.y/100*c.height)}); let a=document.createElement("a"); let name=(values["Item Name"]||current[1]).replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,""); a.download=name+".png"; a.href=c.toDataURL("image/png"); a.click()};
window.onresize=renderOverlay; init();
</script></body></html>
