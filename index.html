<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porky Yorkie Measurement Builder V2.1</title>
<style>
body{margin:0;background:#f7f1e7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}
header{background:#061b3a;color:white;padding:14px 16px;position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:18px}.sub{font-size:12px;opacity:.82}
main{max-width:1320px;margin:auto;padding:12px}.card{background:white;border:1px solid #d7d0c7;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.layout{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:920px){.layout{grid-template-columns:390px 1fr}}
label{display:block;margin:10px 0 4px;font-size:13px;font-weight:900}
input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #b9b2aa;font-size:16px;background:white}
button{border:0;background:#061b3a;color:white;font-weight:900;margin-top:10px}.green{background:#0a7f38}.red{background:#a71d2a}.secondary{background:#555}
.small{font-size:13px;color:#555;line-height:1.35}.loaded{color:#0a7f38;font-weight:900}.missing{color:#a71d2a;font-weight:900}.hidden{display:none!important}
.preview{position:relative;width:100%;background:#eee;border:1px solid #ccc;border-radius:12px;overflow:hidden;min-height:280px}
#templateImg{width:100%;display:block}.overlay{position:absolute;transform:translate(-50%,-50%);color:#061b3a;font-weight:900;font-family:Arial,sans-serif;text-align:center;white-space:nowrap;padding:2px 4px;user-select:none;touch-action:none}
.calibrating .overlay{outline:2px dashed #1473ff;background:rgba(255,255,255,.58);pointer-events:auto;cursor:move}
details{margin-top:14px;border-top:1px solid #eee;padding-top:12px}summary{font-weight:900;cursor:pointer}.statusline{margin-top:8px}.note{font-size:12px;color:#555}.row{display:flex;gap:8px}.row button{flex:1}.selectedField{margin-top:10px;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.sizeReadout{font-size:13px;font-weight:900;color:#061b3a;margin-top:6px}.overlay.selected{outline:3px solid #ffb000!important;background:rgba(255,255,255,.72)}
</style></head>
<body><header><div class="brand">Porky Yorkie Measurement Builder V2.1</div><div class="sub">Flat repo production version</div></header>
<main><section class="card"><label>Garment Template</label><select id="templateSelect"></select><div id="status" class="statusline"></div></section>
<section class="layout"><aside class="card"><div id="fields"></div>
<div id="fontControls" class="selectedField">
  <div class="small">Selected Field: <strong id="selectedFieldName">None</strong></div>
  <div class="sizeReadout">Font Size: <span id="fontSizeReadout">—</span></div>
  <div class="row">
    <button class="secondary" id="smallerBtn">A− Smaller</button>
    <button class="secondary" id="largerBtn">A+ Larger</button>
  </div>
</div>
<button class="green" id="exportBtn">Export Finished PNG</button><button class="secondary" id="clearBtn">Clear Fields</button>
<details open><summary>Position Adjust Mode</summary><p class="small">Turn on, drag text to exact spots, then save. Saved positions stay on this device.</p>
<button class="secondary" id="calibrateBtn">Turn On Position Adjust Mode</button>
<div class="row"><button class="green" id="saveBtn">Save Text Positions</button><button class="red" id="resetBtn">Reset Positions</button></div>
</details><p class="note">Measurements automatically add the inch mark.</p></aside>
<section class="card"><div id="preview" class="preview"><img id="templateImg"><div id="overlay"></div></div></section></section></main>
<script>
const TEMPLATES = [{"id": "short-sleeve-tshirt", "label": "Short Sleeve T-Shirt", "file": "short-sleeve-tshirt.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length"]}, {"id": "long-sleeve-tshirt", "label": "Long Sleeve T-Shirt", "file": "long-sleeve-tshirt.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]}, {"id": "tank-top", "label": "Tank Top", "file": "tank-top.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length"]}, {"id": "sleeveless-shirt", "label": "Sleeveless Shirt", "file": "sleeveless-shirt.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length"]}, {"id": "short-sleeve-polo", "label": "Polo Shirt", "file": "short-sleeve-polo.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length"]}, {"id": "long-sleeve-polo", "label": "Long Sleeve Polo", "file": "long-sleeve-polo.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]}, {"id": "short-sleeve-button-up", "label": "Short Sleeve Button-Up Shirt", "file": "short-sleeve-button-up.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]}, {"id": "hoodie", "label": "Hoodie", "file": "hoodie.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]}, {"id": "crewneck-sweatshirt", "label": "Crew Neck Sweatshirt", "file": "crewneck-sweatshirt.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]}, {"id": "crewneck-sweater", "label": "Crew Neck Sweater", "file": "crewneck-sweater.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]}, {"id": "jeans", "label": "Jeans", "file": "jeans.png", "fields": ["Item Name", "Tagged Size", "Waist", "Rise", "Thigh", "Inseam", "Outseam", "Leg Opening"]}, {"id": "shorts", "label": "Shorts", "file": "shorts.png", "fields": ["Item Name", "Tagged Size", "Waist", "Rise", "Inseam", "Length", "Leg Opening"]}, {"id": "bib-overalls", "label": "Bib Overalls", "file": "bib-overalls.png", "fields": ["Item Name", "Tagged Size", "Overall Length", "Waist", "Rise", "Thigh", "Inseam", "Leg Opening"]}, {"id": "workwear-jacket", "label": "Workwear Jacket", "file": "workwear-jacket.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Shoulder", "Sleeve Length", "Length"]}, {"id": "denim-jacket", "label": "Denim Jacket", "file": "denim-jacket.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Shoulder", "Sleeve Length", "Length"]}, {"id": "workwear-vest", "label": "Workwear Vest", "file": "workwear-vest.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Shoulder", "Length"]}, {"id": "blazer-sportcoat", "label": "Blazer / Sport Coat", "file": "blazer-sportcoat.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Waist", "Shoulder", "Sleeve Length", "Length"]}, {"id": "two-piece-suit", "label": "Two-Piece Suit", "file": "two-piece-suit.png", "fields": ["Item Name", "Tagged Size", "Jacket Pit to Pit", "Jacket Waist", "Shoulder", "Sleeve Length", "Jacket Length", "Pant Waist", "Rise", "Inseam", "Outseam", "Leg Opening"]}, {"id": "three-piece-suit", "label": "Three-Piece Suit", "file": "three-piece-suit.png", "fields": ["Item Name", "Tagged Size", "Jacket Pit to Pit", "Jacket Waist", "Shoulder", "Sleeve Length", "Jacket Length", "Vest Pit to Pit", "Vest Waist", "Vest Length", "Pant Waist", "Rise", "Pant Thigh", "Inseam", "Outseam", "Leg Opening"]}, {"id": "baseball-jersey", "label": "Baseball Jersey", "file": "baseball-jersey.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length"]}, {"id": "basketball-jersey", "label": "Basketball Jersey", "file": "basketball-jersey.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length"]}, {"id": "football-jersey", "label": "Football Jersey", "file": "football-jersey.png", "fields": ["Item Name", "Tagged Size", "Pit to Pit", "Length", "Sleeve Length"]}];
const DEFAULT_POSITIONS = {"Item Name": {"x": 50, "y": 22, "size": 24}, "Tagged Size": {"x": 43, "y": 26.5, "size": 24}, "Pit to Pit": {"x": 48, "y": 45, "size": 34}, "Length": {"x": 58, "y": 53, "size": 34}, "Sleeve Length": {"x": 76, "y": 45, "size": 32}, "Shoulder": {"x": 79, "y": 38, "size": 28}, "Waist": {"x": 46, "y": 35, "size": 28}, "Rise": {"x": 27, "y": 44, "size": 28}, "Thigh": {"x": 45, "y": 57, "size": 28}, "Inseam": {"x": 35, "y": 61, "size": 28}, "Outseam": {"x": 82, "y": 52, "size": 28}, "Leg Opening": {"x": 69, "y": 67, "size": 28}, "Overall Length": {"x": 16, "y": 56, "size": 28}, "Jacket Pit to Pit": {"x": 12, "y": 49, "size": 22}, "Jacket Waist": {"x": 12, "y": 58, "size": 22}, "Jacket Length": {"x": 78, "y": 40, "size": 22}, "Pant Waist": {"x": 12, "y": 77, "size": 22}, "Vest Pit to Pit": {"x": 74, "y": 60, "size": 20}, "Vest Length": {"x": 89, "y": 61, "size": 20}, "Vest Waist": {"x": 74, "y": 66, "size": 20}, "Pant Thigh": {"x": 45, "y": 57, "size": 22}};
const OVERRIDES = {"bib-overalls": {"Item Name": {"x": 63, "y": 20.8, "size": 22}, "Tagged Size": {"x": 47, "y": 25.8, "size": 22}, "Overall Length": {"x": 16, "y": 56.5, "size": 24}, "Waist": {"x": 72, "y": 34.2, "size": 24}, "Rise": {"x": 91.5, "y": 56.0, "size": 23}, "Thigh": {"x": 67.5, "y": 56.0, "size": 23}, "Inseam": {"x": 64.0, "y": 66.0, "size": 23}, "Leg Opening": {"x": 75.0, "y": 66.2, "size": 23}}, "jeans": {"Item Name": {"x": 63, "y": 20.8, "size": 22}, "Tagged Size": {"x": 47, "y": 25.8, "size": 22}, "Waist": {"x": 54, "y": 31.8, "size": 24}, "Rise": {"x": 20.5, "y": 45.5, "size": 24}, "Thigh": {"x": 50.5, "y": 49.5, "size": 24}, "Inseam": {"x": 28, "y": 57.5, "size": 24}, "Outseam": {"x": 85, "y": 49.5, "size": 24}, "Leg Opening": {"x": 66, "y": 67.5, "size": 24}}, "shorts": {"Item Name": {"x": 63, "y": 20.8, "size": 22}, "Tagged Size": {"x": 47, "y": 25.8, "size": 22}, "Waist": {"x": 54, "y": 32.5, "size": 24}, "Rise": {"x": 20, "y": 46, "size": 24}, "Inseam": {"x": 43, "y": 57, "size": 24}, "Length": {"x": 83, "y": 52, "size": 24}, "Leg Opening": {"x": 66, "y": 64, "size": 24}}, "baseball-jersey": {"Pit to Pit": {"x": 24, "y": 62.5, "size": 24}, "Length": {"x": 78, "y": 64, "size": 24}}, "basketball-jersey": {"Pit to Pit": {"x": 30, "y": 61, "size": 24}, "Length": {"x": 76, "y": 62.5, "size": 24}}, "football-jersey": {"Pit to Pit": {"x": 15, "y": 55, "size": 24}, "Length": {"x": 80, "y": 68, "size": 24}, "Sleeve Length": {"x": 81, "y": 45, "size": 24}}};
let current=TEMPLATES[0],values={},positions={},calibrating=false,selectedField=null;
const $=id=>document.getElementById(id);
function defaultPos(f){return (OVERRIDES[current.id]&&OVERRIDES[current.id][f])?{...OVERRIDES[current.id][f]}:(DEFAULT_POSITIONS[f]?{...DEFAULT_POSITIONS[f]}:{x:50,y:50,size:28})}
function loadPositions(){let p={};current.fields.forEach(f=>p[f]=defaultPos(f));try{let saved=JSON.parse(localStorage.getItem("py_pos_v2_"+current.id)||"{}");Object.assign(p,saved)}catch(e){}return p}
function savePositions(){localStorage.setItem("py_pos_v2_"+current.id,JSON.stringify(positions));alert("Positions saved for "+current.label)}
function init(){TEMPLATES.forEach((t,i)=>{let o=document.createElement("option");o.value=i;o.textContent=t.label;$("templateSelect").appendChild(o)});$("templateSelect").onchange=()=>loadTemplate(Number($("templateSelect").value));loadTemplate(0)}
function loadTemplate(i){current=TEMPLATES[i];values={};selectedField=null;positions=loadPositions();let img=$("templateImg");img.src=current.file+"?v=2";img.onload=()=>{$("status").innerHTML='<span class="loaded">✅ Loaded: '+current.label+'</span>';renderOverlay()};img.onerror=()=>{$("status").innerHTML='<span class="missing">❌ Missing image: '+current.file+'</span>'};renderFields();renderOverlay()}
function renderFields(){let box=$("fields");box.innerHTML="";current.fields.forEach(f=>{let l=document.createElement("label");l.textContent=f;let inp=document.createElement("input");inp.placeholder=f;inp.value=values[f]||"";inp.oninput=()=>{values[f]=inp.value;renderOverlay()};box.appendChild(l);box.appendChild(inp)})}
function isMeasure(f){return f!=="Item Name"&&f!=="Tagged Size"}function fmt(f,v){v=String(v||"").trim();if(!v)return"";return v}
function updateSelectedUI(){let name=$("selectedFieldName"),size=$("fontSizeReadout");if(!name||!size)return;if(selectedField&&positions[selectedField]){name.textContent=selectedField;size.textContent=positions[selectedField].size||28}else{name.textContent="None";size.textContent="—"}}
function selectFieldOnly(f){selectedField=f;updateSelectedUI();document.querySelectorAll(".overlay").forEach(el=>el.classList.remove("selected"));let picked=document.querySelector('[data-field="'+CSS.escape(f)+'"]');if(picked)picked.classList.add("selected")}
function changeFontSize(delta){if(!selectedField){alert("Tap or drag a text field first while Position Adjust Mode is on.");return}positions[selectedField]=positions[selectedField]||defaultPos(selectedField);positions[selectedField].size=Math.max(8,Math.min(90,(positions[selectedField].size||28)+delta));updateSelectedUI();renderOverlay()}
function renderOverlay(){let layer=$("overlay"),wrap=$("preview");layer.innerHTML="";wrap.classList.toggle("calibrating",calibrating);current.fields.forEach(f=>{let p=positions[f]||defaultPos(f),v=fmt(f,values[f]);if(!v&&!calibrating)return;let d=document.createElement("div");d.className="overlay"+(selectedField===f?" selected":"");d.dataset.field=f;d.textContent=v||f;d.style.left=p.x+"%";d.style.top=p.y+"%";d.style.fontSize=Math.max(11,wrap.clientWidth*((p.size||28)/1254))+"px";d.style.opacity=v?1:.62;if(calibrating)drag(d,f);layer.appendChild(d)});updateSelectedUI()}
function drag(el,f){let down=false;function move(x,y){let r=$("preview").getBoundingClientRect();positions[f]=positions[f]||defaultPos(f);positions[f].x=Math.max(0,Math.min(100,(x-r.left)/r.width*100));positions[f].y=Math.max(0,Math.min(100,(y-r.top)/r.height*100));el.style.left=positions[f].x+"%";el.style.top=positions[f].y+"%"}el.onpointerdown=e=>{down=true;e.preventDefault();selectFieldOnly(f);try{el.setPointerCapture(e.pointerId)}catch(err){}move(e.clientX,e.clientY)};el.onpointermove=e=>{if(down){e.preventDefault();move(e.clientX,e.clientY)}};el.onpointerup=e=>{down=false;try{el.releasePointerCapture(e.pointerId)}catch(err){}};el.onclick=e=>{e.preventDefault();selectFieldOnly(f)}}
$("calibrateBtn").onclick=()=>{calibrating=!calibrating;$("calibrateBtn").textContent=calibrating?"Turn Off Position Adjust Mode":"Turn On Position Adjust Mode";renderOverlay()};$("smallerBtn").onclick=()=>changeFontSize(-1);$("largerBtn").onclick=()=>changeFontSize(1);
$("saveBtn").onclick=savePositions;$("resetBtn").onclick=()=>{if(confirm("Reset positions for this template?")){localStorage.removeItem("py_pos_v2_"+current.id);positions=loadPositions();renderOverlay()}};
$("clearBtn").onclick=()=>loadTemplate(Number($("templateSelect").value));
$("exportBtn").onclick=()=>{let img=$("templateImg");if(!img.complete||img.naturalWidth===0){alert("Template image is missing or still loading.");return}let c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;let ctx=c.getContext("2d");ctx.drawImage(img,0,0);current.fields.forEach(f=>{let v=fmt(f,values[f]);if(!v)return;let p=positions[f]||defaultPos(f),size=Math.round((p.size||28)*(c.width/1254));ctx.fillStyle="#061b3a";ctx.font="900 "+size+"px Arial, sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(v,p.x/100*c.width,p.y/100*c.height)});let a=document.createElement("a");let name=(values["Item Name"]||current.label).replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"");a.download=name+".png";a.href=c.toDataURL("image/png");a.click()};
window.onresize=renderOverlay;init();
</script></body></html>
